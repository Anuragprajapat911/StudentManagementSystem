<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Update Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Student Update Form</h2>

    <form th:action="@{/student/edit/{id} (id=${student.id})}" th:object="${student}" method="post">
        <div class="form-group">
            <label for="firstname">Student First Name</label>
            <input type="text" class="form-control" id="firstname" th:field="*{firstname}" placeholder="Enter your first name">
        </div>

        <div class="form-group">
            <label for="lastname">Student Last Name</label>
            <input type="text" class="form-control" id="lastname" th:field="*{lastname}" placeholder="Enter your last name">
        </div>

        <div class="form-group">
            <label for="email">Student Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Enter your email">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Update</button>
    </form>
</div>
</body>
</html>
