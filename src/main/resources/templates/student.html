<!DOCTYPE html>
<html xmlns:th="html:www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Management System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>




<nav class="navbar navbar-expand-md bg-dark navbar-dark">



<!-- Brand -->

<a class="navbar-brand" href="#">Student Management System</a>

<!-- Toggler/collapsibe Button -->

<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar"> <span class="navbar-toggler-icon"></span>

</button>



<!-- Navbar links -->

<div class="collapse navbar-collapse" id="collapsibleNavbar"> 
<ul class="navbar-nav"></ul>

<li class="nav-item">
<a class="nav-link" th:href="@{student}">Student Management</a></li>

</ui>

</div>
</nav>


<div class=containe> 

<div class="text-center"> 

<h2></h2>
</div>
<div class="row">

<div class="col-lg-3"> 

<a th:href="@{student/new}" class="btn btn-primary btn-sm mb-3"> Add Student</a>

</div>
</div>

<h2 class=text-center> Student List</h2>
<table class="table table-striped table-bordered "> 
<thead class="table-dark"> 
<tr>
<th> First name </th>
<th> Last name </th>
<th> Email </th>
<th> Action</th>
 </tr>
</thead>

<tbody> 
<tr th:each="student:${student}">

<td th:text="${student.firstname}"></td>
<td th:text="${student.lastname}"></td>
<td th:text="${student.email}"></td>
<td>
<a th:href="@{/student/edit/{id}(id=${student.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/student/delete/{id}(id=${student.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>



</td>

 </tr>




</tbody>

</table>
</div>

</body>
</html>
